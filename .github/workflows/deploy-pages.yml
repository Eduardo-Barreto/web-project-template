name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      # Public Pages serves at owner.github.io/<repo>, so the base must match the
      # repo name. Unset BASE_PATH (or hardcode "/") only if this deploys to a
      # Pages setup that serves at the subdomain root instead (e.g. GitHub
      # Enterprise Cloud's private Pages with subdomain isolation).
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
